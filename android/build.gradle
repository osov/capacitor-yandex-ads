ext {
    junitVersion = project.hasProperty('junitVersion') ? rootProject.ext.junitVersion : '4.13.2'
    androidxAppCompatVersion = project.hasProperty('androidxAppCompatVersion') ? rootProject.ext.androidxAppCompatVersion : '1.4.2'
    androidxJunitVersion = project.hasProperty('androidxJunitVersion') ? rootProject.ext.androidxJunitVersion : '1.1.3'
    androidxEspressoCoreVersion = project.hasProperty('androidxEspressoCoreVersion') ? rootProject.ext.androidxEspressoCoreVersion : '3.4.0'
}

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.4'
    }
}

apply plugin: 'com.android.library'

android {
    namespace "com.osova.yandex.ads"
    compileSdkVersion project.hasProperty('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 36
    defaultConfig {
        minSdkVersion project.hasProperty('minSdkVersion') ? rootProject.ext.minSdkVersion : 21
        targetSdkVersion project.hasProperty('targetSdkVersion') ? rootProject.ext.targetSdkVersion : 36
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    lint {
        abortOnError false
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

repositories {
    google()
    mavenCentral()
    // Адаптеры медиации ironSource и Mintegral в Maven Central не
    // публикуются. Адреса те же, что были в Defold-расширении игры.
    //
    // Одного объявления здесь мало: классы приложения Gradle разрешает
    // репозиториями самого приложения, а не плагина, поэтому те же два адреса
    // обязаны быть в корневом build.gradle приложения (allprojects).
    maven { url "https://android-sdk.is.com/" }
    maven { url "https://dl-maven-android.mintegral.com/repository/mbridge_android_sdk_oversea" }
}


dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation project(':capacitor-android')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    // SDK 8 требует compileSdk 35+, minSdk 21+ и AGP 8.7+.
    // Если в приложении есть AppMetrica, её версия должна быть 8.3.0+.
    implementation 'com.yandex.android:mobileads:8.3.0'

    // Медиация. Без адаптеров у SDK остаётся один источник спроса -
    // собственный RTB Яндекса, и на одном рекламном блоке аукцион раз за разом
    // выигрывает тот же креатив: баннер перезагружается, а картинка не
    // меняется. Набор сетей и версии - как в Defold-расширении игры
    // (defold-yandex-easy-monetization), там медиация работала с этим же
    // SDK 8.3.0; версия адаптера повторяет версию SDK сети, последняя цифра -
    // ревизия самого адаптера.
    //
    // Приложению с этими адаптерами обязательны meta-data в манифесте:
    // com.google.android.gms.ads.APPLICATION_ID (без него Google-адаптер роняет
    // процесс на старте) и applovin.sdk.key. Подробности в README.
    //
    // Лишнюю сеть приложение может выключить, не трогая плагин:
    // configurations.all { exclude group: 'com.yandex.ads.mediation', module: '...' }
    implementation 'com.yandex.ads.mediation:mobileads-google:25.2.0.2'
    implementation 'com.yandex.ads.mediation:mobileads-unityads:4.17.0.3'
    implementation 'com.yandex.ads.mediation:mobileads-applovin:13.6.3.0'
    implementation 'com.yandex.ads.mediation:mobileads-ironsource:9.2.0.3'
    implementation 'com.yandex.ads.mediation:mobileads-mintegral:17.0.41.3'
    implementation 'com.yandex.ads.mediation:mobileads-bigoads:5.7.0.3'
    implementation 'com.yandex.ads.mediation:mobileads-vungle:7.7.0.3'
    implementation 'com.yandex.ads.mediation:mobileads-mytarget:5.45.3.4'
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
}
